    <!-- Anti-FOUC / Anti-FART Synchronous Theme Initializer -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('autotrace_theme_mode') || 'dark';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var accent = localStorage.getItem('autotrace_theme_accent') || 'electric-blue';
          var density = localStorage.getItem('autotrace_theme_density') || 'comfortable';
          var motion = localStorage.getItem('autotrace_theme_motion') || 'system';

          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', theme);
          document.documentElement.setAttribute('data-accent', accent);
          document.documentElement.setAttribute('data-density', density);
          document.documentElement.setAttribute('data-motion', motion);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
