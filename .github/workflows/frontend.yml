name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (browser app)
        run: npx tsc -p tsconfig.frontend.json --noEmit

      - name: Process math unit test
        run: npx tsx src/tests/processMathTest.ts

      - name: Process graph math unit test
        run: npx tsx src/tests/processGraphMathTest.ts

      - name: Native canvas topology unit test
        run: npx tsx src/tests/nativeCanvasTopologyTest.ts

      - name: Resource simulation unit test
        run: npx tsx src/tests/processSimulationTest.ts

      - name: Process risk unit test
        run: npx tsx src/tests/processRiskTest.ts

      - name: Batch-cycle simulation unit test
        run: npx tsx src/tests/processBatchSimulationTest.ts

      - name: Batch Monte Carlo unit test
        run: npx tsx src/tests/processBatchRiskTest.ts

      - name: Stochastic digital twin unit test
        run: npx tsx src/tests/processDigitalTwinTest.ts

      - name: Resource calendar unit test
        run: npx tsx src/tests/processResourceCalendarTest.ts

      - name: Digital twin calendar integration test
        run: npx tsx src/tests/processDigitalTwinCalendarTest.ts

      - name: Reliability MTBF MTTR unit test
        run: npx tsx src/tests/processReliabilityTest.ts

      - name: Production build
        run: npm run build
