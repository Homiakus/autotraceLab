name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (browser app)
        run: npx tsc -p tsconfig.frontend.json --noEmit

      - name: Process math unit test
        run: npx tsx src/tests/processMathTest.ts

      - name: Process graph math unit test
        run: npx tsx src/tests/processGraphMathTest.ts

      - name: Production build
        run: npm run build
