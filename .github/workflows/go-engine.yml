name: Go engine

on:
  push:
    branches: [main]
    paths: ["go_engine/**", ".github/workflows/go-engine.yml"]
  pull_request:
    paths: ["go_engine/**", ".github/workflows/go-engine.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test Go engine
        run: cd go_engine && go test ./...

      - name: Vet Go engine
        run: cd go_engine && go vet ./...

      - name: Build versioned WASM package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/autotrace
          cd go_engine
          GOOS=js GOARCH=wasm go build -trimpath -o ../dist/autotrace/autotrace-core.wasm .
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ../dist/autotrace/wasm_exec.js
          cd ..
          cat > dist/autotrace/engine-manifest.json <<EOF
          {
            "name": "autotrace-core",
            "contractVersion": 1,
            "protocolVersion": 1,
            "runtime": "go-wasm",
            "commit": "${GITHUB_SHA}",
            "entrypoint": "businessOSAutoTraceRequest",
            "wasm": "autotrace-core.wasm",
            "wasmExec": "wasm_exec.js"
          }
          EOF
          (cd dist/autotrace && sha256sum autotrace-core.wasm wasm_exec.js engine-manifest.json > SHA256SUMS)
          cat dist/autotrace/engine-manifest.json
          cat dist/autotrace/SHA256SUMS

      - name: Upload WASM engine package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: autotrace-engine-${{ github.sha }}
          path: dist/autotrace/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable engine release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="engine-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            dist/autotrace/autotrace-core.wasm \
            dist/autotrace/wasm_exec.js \
            dist/autotrace/engine-manifest.json \
            dist/autotrace/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "AutoTrace Engine ${GITHUB_SHA:0:12}" \
            --notes "Immutable AutoTrace Go/WASM engine artifact for commit ${GITHUB_SHA}. Consumers must pin this exact commit and verify SHA256SUMS before vendoring." \
            --latest=false
